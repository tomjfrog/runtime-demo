# Integrity Demo — Setup: set imagePullPolicy IfNotPresent (run after Sync, before Trigger).
# Run after Reset; required before Trigger can create an integrity violation.
# Requires: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (SSO); vars per AGENTS.md
# See docs/integrity-violation-workflow.mmd and AGENTS.md

name: 'Integrity Demo — Setup'

on:
  workflow_dispatch:

env:
  K8S_DEPLOYMENT: integrity-demo-app
  K8S_NAMESPACE: runtime-demo

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ vars.EKS_CLUSTER_NAME }}

      - name: Apply namespace if not already exists
        run: kubectl apply -f k8s/namespace.yaml

      - name: Set IfNotPresent
        run: |
          kubectl patch deployment ${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} \
            --type='json' \
            -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy", "value": "IfNotPresent"}]'
