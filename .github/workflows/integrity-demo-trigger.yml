# Integrity Demo — Trigger: build+push new image, redeploy (triggers violation).
# Prerequisite: Run Setup (or ensure imagePullPolicy: IfNotPresent) before first Trigger.
# Requires: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (SSO); vars per AGENTS.md
# See docs/integrity-violation-workflow.mmd and AGENTS.md

name: 'Integrity Demo — Trigger Violation'

on:
  workflow_dispatch:

env:
  K8S_DEPLOYMENT: integrity-demo-app
  K8S_NAMESPACE: runtime-demo
  DOCKER_REPOSITORY: runtimedemo-integrity-demo-app-docker-dev
  IMAGE_NAME: integrity-demo-app
  IMAGE_METADATA_FILE: 'image-metadata'
  BUILD_NAME: 'integrity-demo-app-build'

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ vars.EKS_CLUSTER_NAME }}

      - name: Generate unique value
        id: unique
        run: echo "value=$(openssl rand -hex 4 | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup JFrog (OIDC)
        id: jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          version: 'latest'
          oidc-provider-name: 'github-oidc-integration'
          oidc-audience: 'jfrog-github'
          disable-auto-build-publish: true

      - name: Docker login (JFrog)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_DOCKER_REGISTRY }}
          username: ${{ steps.jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.jfrog-cli.outputs.oidc-token }}

      - name: Build and push new image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: ${{ github.workspace }}/integrity-demo-app
          file: ${{ github.workspace }}/integrity-demo-app/Dockerfile
          build-args: |
            UNIQUE_VALUE=${{ steps.unique.outputs.value }}
          push: true
          tags: |
            ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.unique.outputs.value }}
            ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create Image Metadata File
        run: |
          echo "${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.unique.outputs.value }}@${{ steps.build-and-push.outputs.digest }}" > ${{ env.IMAGE_METADATA_FILE }}
    
      - name: Docker Build Info
        run: |
          jf rt build-docker-create \
          ${{ env.DOCKER_REPOSITORY }} \
          --build-name=${{ env.BUILD_NAME }} \
          --build-number=${{ github.run_number }} \
          --image-file ${{ env.IMAGE_METADATA_FILE }}
    
      - name: Publish Build Info
        run: |
          jf rt build-publish ${{ env.BUILD_NAME }} ${{ github.run_number }}
    
      - name: Redeploy (uses cached image)
        run: |
          kubectl rollout restart deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Verify integrity violation (hosted vs running)
        run: |
          K8S=$(kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/${{ env.K8S_DEPLOYMENT }} -- cat /app/build_id.txt 2>/dev/null | tr -d '\n')
          ARTIFACTORY="${{ steps.unique.outputs.value }}"
          echo "Running image (cached): $K8S"
          echo "Hosted image (latest):  $ARTIFACTORY"
          if [ "$K8S" = "$ARTIFACTORY" ]; then
            echo "MATCH — pod pulled fresh. No integrity violation. Demo may not work as expected."
            exit 1
          else
            echo "MISMATCH — integrity violation! Pod used cached image. Demo succeeded."
          fi
