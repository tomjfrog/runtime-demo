# Builds the runtime-demo-app Docker image and pushes to JFrog Artifactory.
# Requires GitHub vars: JF_URL, JF_PROJECT, JF_DOCKER_REGISTRY
# Uses JFrog OIDC integration (oidc-provider-name: github-oidc-integration, oidc-audience: jfrog-github)

name: 'Build and Deploy to Artifactory'

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  security-events: write
  attestations: write

env:
  DOCKER_REPOSITORY: 'docker-local'
  IMAGE_NAME: 'runtime-demo-app'
  IMAGE_METADATA_FILE: 'image-metadata'
  BUILD_NAME: 'runtime-demo-app'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        id: jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          version: 'latest'
          oidc-provider-name: 'github-oidc-integration'
          oidc-audience: 'jfrog-github'
          disable-auto-build-publish: true

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_DOCKER_REGISTRY }}
          username: ${{ steps.jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.jfrog-cli.outputs.oidc-token }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create Image Metadata File
        run: |
          echo "${{ vars.JF_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}@${{ steps.build-and-push.outputs.digest }}" > ${{ env.IMAGE_METADATA_FILE }}

      - name: Docker Build Info
        run: |
          jf rt build-docker-create \
            ${{ env.DOCKER_REPOSITORY }} \
            --build-name=${{ env.BUILD_NAME }} \
            --build-number=${{ github.run_number }} \
            --image-file ${{ env.IMAGE_METADATA_FILE }}

      - name: Publish Build Info
        run: |
          jf rt build-publish ${{ env.BUILD_NAME }} ${{ github.run_number }}
