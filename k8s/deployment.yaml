apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-demo-app
  namespace: runtime-demo
  labels:
    app: runtime-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-demo-app
  template:
    metadata:
      labels:
        app: runtime-demo-app
    spec:
      imagePullSecrets:
        - name: artifactory-registry
      containers:
        - name: app
          # Replace your-artifactory with your JF_DOCKER_REGISTRY value (e.g. company.jfrog.io)
          image: your-artifactory.jfrog.io/docker-local/runtime-demo-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
