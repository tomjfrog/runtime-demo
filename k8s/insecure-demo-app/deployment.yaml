apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-demo-app
  namespace: runtime-demo
  labels:
    app: insecure-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-demo-app
  template:
    metadata:
      labels:
        app: insecure-demo-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ip-192-168-63-72.us-east-2.compute.internal
      imagePullSecrets:
        - name: artifactory-registry
      containers:
        - name: app
          image: danielw.jfrog.io/runtimedemo-docker-dev/insecure-demo-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
